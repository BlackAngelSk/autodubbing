name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting with pyright (optional)
        continue-on-error: true
        run: |
          pip install pyright
          pyright autodub/ || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_pipeline.py

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t autodub:latest .

      - name: Verify Docker image
        run: |
          docker run --rm autodub:latest python -c "import autodub; print('Package loaded successfully')"